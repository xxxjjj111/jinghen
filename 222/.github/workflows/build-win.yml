name: Build Windows exe

# 触发方式：push 到 main 分支，或手动在 Actions 页点 "Run workflow"
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖（国内走镜像加速）
        run: npm install
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 打包 Windows .exe
        run: npm run build:win
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: residual-shadow-exe
          path: dist/*.exe
